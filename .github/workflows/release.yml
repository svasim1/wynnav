# Publishes a GitHub release when a version tag is pushed, e.g. v1.0.0+1.21.11.
# The tag must match mod_version in gradle.properties (with a leading "v").

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: check tag matches mod version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi
      - name: build
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minecraft=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "Wynnav ${GITHUB_REF_NAME#v}" \
            --notes "For Minecraft $minecraft with Fabric Loader and Fabric API. Install the jar without \"-sources\" in your mods folder." \
            --generate-notes
